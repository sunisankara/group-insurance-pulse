name: Daily Pulse — Healthcare
on:
  schedule:
    - cron: '40 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: generate script only, no audio/publish (true/false)'
        required: false
        default: 'false'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install System Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Pulse Engine
        env:
          API_KEY: ${{ secrets.API_KEY }}
          IS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx engine/run.ts --show healthcare

      - name: Prune old audio
        if: github.event.inputs.dry_run != 'true'
        run: node scripts/prune-audio.mjs --keep 30

      - name: Commit and Push Broadcast
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Pulse Engine Bot"
          git config user.email "shankar.sundaram.0@gmail.com"
          # Only feed artifacts — never temp files or node_modules
          git add rss/ || true
          if git diff --cached --quiet; then
            echo "No new broadcast files. Skipping."
          else
            git commit -m "New episode (healthcare): $(date +'%Y-%m-%d')"
            git pull origin main --rebase
            git push origin main
          fi
